<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Rock Blaster</title>
<style>
body{margin:0;background:#080810;color:#e8ecff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;user-select:none;touch-action:manipulation}
h1{font-size:1.4rem;margin:12px 0 4px;color:#9ad0ff}
canvas{background:#0d0d1e;border:2px solid #2a2f66;border-radius:10px;max-width:96vw;max-height:64vh}
.b{display:flex;gap:8px;margin:8px;flex-wrap:wrap;justify-content:center}
button{padding:12px 18px;font-size:1.1rem;background:#9ad0ff;color:#080810;border:0;border-radius:8px;cursor:pointer;font-weight:bold;touch-action:manipulation}
p{margin:4px;font-size:.85rem;opacity:.7}
</style></head><body>
<h1>Rock Blaster</h1>
<canvas id="c" width="560" height="440"></canvas>
<div class="b"><button id="L">⟲</button><button id="U">Poussée</button><button id="R">⟳</button><button id="F">Tir</button><button id="rp">Rejouer</button></div>
<p>Flèches gauche/droite pour tourner, haut pour accélérer, espace pour tirer</p>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=560,H=440;
let best=0;try{best=+localStorage.getItem('pz_asteroids')||0}catch(e){}
let s,rocks,bl,lives,score,over,k={},cd,inv,lvl;
function rock(px,py,r){const a=Math.random()*6.28,v=.6+Math.random()*1.2;
  const n=9,sh=[];for(let i=0;i<n;i++)sh.push(.75+Math.random()*.35);
  return{x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r,sh,a:0,va:(Math.random()-.5)*.04}}
function wave(){rocks=[];for(let i=0;i<3+lvl;i++){let px,py;do{px=Math.random()*W;py=Math.random()*H}while(Math.hypot(px-s.x,py-s.y)<120);rocks.push(rock(px,py,36))}}
function reset(){s={x:W/2,y:H/2,vx:0,vy:0,a:-Math.PI/2};bl=[];lives=3;score=0;over=false;cd=0;inv=120;lvl=1;wave()}
function end(){over=true;if(score>best){best=score;try{localStorage.setItem('pz_asteroids',best)}catch(e){}}}
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code)){e.preventDefault();k[e.code]=1}});
addEventListener('keyup',e=>delete k[e.code]);
for(const [id,key] of [['L','ArrowLeft'],['R','ArrowRight'],['U','ArrowUp'],['F','Space']]){
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();k[key]=1});
  for(const ev of ['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,()=>delete k[key]);
}
const wr=o=>{o.x=(o.x+W)%W;o.y=(o.y+H)%H};
function update(){
  if(over)return;
  if(k.ArrowLeft)s.a-=.07;if(k.ArrowRight)s.a+=.07;
  if(k.ArrowUp){s.vx+=Math.cos(s.a)*.12;s.vy+=Math.sin(s.a)*.12}
  s.vx*=.992;s.vy*=.992;s.x+=s.vx;s.y+=s.vy;wr(s);
  if(cd>0)cd--;if(inv>0)inv--;
  if(k.Space&&cd===0&&bl.length<6){bl.push({x:s.x+Math.cos(s.a)*14,y:s.y+Math.sin(s.a)*14,vx:Math.cos(s.a)*7+s.vx,vy:Math.sin(s.a)*7+s.vy,l:55});cd=12}
  for(const b of bl){b.x+=b.vx;b.y+=b.vy;b.l--;wr(b)}
  bl=bl.filter(b=>b.l>0);
  for(const r of rocks){r.x+=r.vx;r.y+=r.vy;r.a+=r.va;wr(r)}
  const nr=[];
  for(const r of rocks){
    let hit=false;
    for(const b of bl)if(b.l>0&&Math.hypot(b.x-r.x,b.y-r.y)<r.r){b.l=0;hit=true;break}
    if(hit){score+=r.r>25?20:r.r>14?50:100;if(r.r>14){nr.push(rock(r.x,r.y,r.r/2),rock(r.x,r.y,r.r/2))}}
    else nr.push(r);
  }
  rocks=nr;
  if(!inv)for(const r of rocks)if(Math.hypot(s.x-r.x,s.y-r.y)<r.r*.85+8){
    lives--;if(lives<=0){end()}else{s.x=W/2;s.y=H/2;s.vx=s.vy=0;inv=150}break}
  if(!rocks.length){lvl++;wave();inv=90}
}
function draw(){
  x.fillStyle='#0d0d1e';x.fillRect(0,0,W,H);
  x.strokeStyle='#cfd8ff';x.lineWidth=2;
  for(const r of rocks){x.save();x.translate(r.x,r.y);x.rotate(r.a);x.beginPath();
    r.sh.forEach((m,i)=>{const a=i/r.sh.length*6.283;x[i?'lineTo':'moveTo'](Math.cos(a)*r.r*m,Math.sin(a)*r.r*m)});
    x.closePath();x.stroke();x.restore()}
  x.fillStyle='#ffd166';for(const b of bl){x.beginPath();x.arc(b.x,b.y,2.5,0,7);x.fill()}
  if(!over&&(inv%10<6)){x.save();x.translate(s.x,s.y);x.rotate(s.a);x.strokeStyle='#9ad0ff';x.beginPath();
    x.moveTo(14,0);x.lineTo(-10,9);x.lineTo(-6,0);x.lineTo(-10,-9);x.closePath();x.stroke();
    if(k.ArrowUp){x.strokeStyle='#ff9f43';x.beginPath();x.moveTo(-8,3);x.lineTo(-17,0);x.lineTo(-8,-3);x.stroke()}
    x.restore()}
  x.fillStyle='#fff';x.font='16px system-ui';x.textAlign='left';x.fillText('Score '+score+'   Niveau '+lvl,10,22);
  x.textAlign='right';x.fillText('Vies '+Math.max(0,lives)+'   Record '+best,W-10,22);
  if(over){x.fillStyle='rgba(8,8,16,.8)';x.fillRect(0,160,W,120);x.textAlign='center';
    x.fillStyle='#9ad0ff';x.font='bold 32px system-ui';x.fillText('Partie terminée',W/2,210);
    x.fillStyle='#fff';x.font='16px system-ui';x.fillText('Score : '+score+' — cliquez sur Rejouer',W/2,245)}
}
function loop(){update();draw();requestAnimationFrame(loop)}
document.getElementById('rp').onclick=e=>{reset();e.target.blur()};
reset();loop();
</script></body></html>
