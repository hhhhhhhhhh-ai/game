<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Lights Out</title>
<style>
:root{--bg:#0c0f1d;--pn:#181d36;--ac:#fbbf24;--tx:#e6e9f5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#1a1f3d,var(--bg));color:var(--tx);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px;user-select:none;-webkit-user-select:none}
h1{margin:6px 0;font-size:1.5rem;letter-spacing:.08em;color:var(--ac)}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;width:min(94vw,400px);margin:6px 0}
.stat{background:var(--pn);padding:6px 12px;border-radius:8px;text-align:center}
button{background:var(--ac);color:#2a1d00;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:1rem}
button.off{background:var(--pn);color:var(--tx)}
#b{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(94vw,400px);background:var(--pn);padding:10px;border-radius:14px;touch-action:manipulation}
.c{aspect-ratio:1;border-radius:10px;background:#0a0d1a;border:2px solid #2a3157;cursor:pointer;transition:background .15s,box-shadow .15s}
.c.on{background:radial-gradient(circle,#fde68a,#f59e0b);border-color:#fbbf24;box-shadow:0 0 18px #f59e0b99}
#msg{height:1.6em;margin:10px;font-weight:700;color:var(--ac)}
small{opacity:.6;text-align:center;max-width:400px}
</style></head><body>
<h1>LIGHTS OUT</h1>
<div class="bar"><div class="stat" id="lv">Niveau 1</div><div class="stat" id="mv">Coups 0</div><div class="stat" id="bs">Record --</div></div>
<div class="bar"><button id="rj">Rejouer</button><button id="rs" class="off">Recommencer</button></div>
<div id="b"></div>
<div id="msg"></div>
<small>Cliquer une case inverse celle-ci et ses voisines. Éteignez tout ! (Touche R : recommencer)</small>
<script>
const $=s=>document.querySelector(s),N=5,K='pz_lightsout_best';
let g,start,moves,level=1,done;
const cells=[];
function best(){try{return +localStorage.getItem(K)||0}catch(e){return 0}}
function press(a,i){
  const r=i/N|0,c=i%N;
  [[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{
    const y=r+dr,x=c+dc;if(y>=0&&y<N&&x>=0&&x<N)a[y*N+x]^=1;
  });
}
function gen(){
  let a;
  do{
    a=Array(N*N).fill(0);
    const n=4+Math.min(level,10)+(Math.random()*3|0);
    const idx=[...Array(N*N).keys()].sort(()=>Math.random()-.5).slice(0,Math.min(n,N*N));
    idx.forEach(i=>press(a,i));
  }while(!a.some(v=>v));
  return a;
}
function newLevel(){start=gen();reset()}
function reset(){g=start.slice();moves=0;done=0;$('#msg').textContent='';draw()}
function draw(){
  g.forEach((v,i)=>cells[i].classList.toggle('on',!!v));
  $('#lv').textContent='Niveau '+level;$('#mv').textContent='Coups '+moves;
  const b=best();$('#bs').textContent='Record '+(b?b+' coups':'--');
}
function click(i){
  if(done)return;
  press(g,i);moves++;draw();
  if(!g.some(v=>v)){
    done=1;let m='Bravo ! Résolu en '+moves+' coups.';
    const b=best();if(!b||moves<b){try{localStorage.setItem(K,moves)}catch(e){}m+=' Record !'}
    $('#msg').textContent=m+' Niveau suivant...';draw();
    setTimeout(()=>{if(done){level++;newLevel()}},1500);
  }
}
for(let i=0;i<N*N;i++){
  const d=document.createElement('div');d.className='c';
  d.onpointerdown=e=>{e.preventDefault();click(i)};
  $('#b').appendChild(d);cells.push(d);
}
$('#rj').onclick=()=>{level=1;newLevel()};
$('#rs').onclick=reset;
document.onkeydown=e=>{if(e.key==='r'||e.key==='R')reset()};
newLevel();
</script></body></html>
